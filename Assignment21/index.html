<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = Number(prompt("How many numbers You want to enter."));
      let arr = [];
      let sum=0;
      for (let i = 0; i < n; i++) {
        let num = Number(prompt(`Enter number:${i + 1}`));
        arr.push(num);
      }
      document.write("The Entered numbers are:");
      for (let hello of arr) {
        document.write(hello + " ");
        sum+=hello;
      }
      document.write("<br/>The Sum of numbers in array are:"+sum);
      document.write("<br/>The numbers in reverse order are:");
      for(let i=arr.length-1;i>=0;i--){
        document.write(arr[i]+" ");
      }

    </script>
  </body>
</html>
