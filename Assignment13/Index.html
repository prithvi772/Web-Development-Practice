<body>
    <script>
        let num=Number(window.prompt("Enter number to calculate Factors:"));
        let count=0,html="";
        for(let i=0;i<=num;i++){
            if(num%i==0){
                html+=i+" ";
                count++;
            }
            
        }
        document.writeln(`There are ${count} factors of ${num}:`);   
        document.write(html);
