<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array- max and min</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      div,
      h2{
        width: 80%;
        margin: 10px auto;
      }
      div {
        background-color: black;
        color: white;
        padding: 10px;
      }
      .underline {
        text-decoration: underline;
        color: cadetblue;
      }
    </style>
  </head>
  <body>
    <script>
      let a = [30, 10, 125, 120, 14, 15, 65, 63, 3, 80, 28, 5];
      let i;
      document.write(`<h2>The given array is</h2>`);
      let html = "<div><h4>";
      for (i = 0; i < a.length; i++) {
        html += `${a[i]} `;
      }
      html += "</h4></div>";
      document.write(html);

//---------------------------------------------------------------------------

      let max=a[0];
      let maxIndex=0;
      for(let i=0;i<a.length;i++){
        if(max<a[i]){
            max=a[i];
            maxIndex=i;
        }
      }
      let html1 = `<div><h4> Maximum is ${max} and its index is ${maxIndex} </h4></div>`;
      document.write(html1);

//---------------------------------------------------------------------------

      let min=a[0];
      let minIndex=0;
      for(let i=0;i<a.length;i++){
        if(min>a[i]){
            min=a[i];
            minIndex=i;
        }
      }
      let html2 = `<div><h4> Minimum is ${min} and its index is ${minIndex} </h4></div>`;
      document.write(html2);

    </script>
  </body>
</html>
