<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Searching substring</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      h1,
      h2 {
        width: 60%;
        margin: 50px auto;
        padding: 10px;
      }
      h1 {
        color: red;
        text-align: justify;
        border: 3px solid red;
      }
      h2 {
        color: blue;
        text-align: center;
        border: 3px solid blue;
      }
    </style>
  </head>
  <body>
    <script>
      let s =
        "Javascript is object-based language. JavaScript is used to create user-interactive and dynamic web pages. Original name of JavaScript is ECMASCRIPT";
      document.write(`<h1>${s}</h1>`);

      let str=window.prompt("Enter string:");
      if(s.includes(str)){
        document.write(`<h2>Found</h2>`);
      }
      else{
        document.write("<h2>Not Found</h2>");
      }
    </script>
  </body>
</html>
