<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array-analysis</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      div,
      h2 {
        width: 80%;
        margin: 10px auto;
      }
      div {
        background-color: cadetblue;
        padding: 10px;
      }
      .underline {
        text-decoration: underline;
        color: cadetblue;
      }
    </style>
  </head>
  <body>
    <script>
      let a = [3, 10, 125, 120, 14, 15, 65, 63, 14, 80, 28, 5];
      let i,
        c = 0,
        sumEven=0,
        sumOdd=0;
      //1
      document.write(`<h2>The given array is</h2>`);
      let html = "<div><h4>";
      for (i = 0; i < a.length; i++) {
        html += `${a[i]} `;
      }
      html += "</h4></div>";
      document.write(html);
      document.write(`<h2>The numbers which are divisble by 5 are:</h2>`);

      let html1 = "<div><h4>";
      for (let i = 0; i < a.length; i++) {
        if (a[i] % 5 == 0) {
          html1 += `${a[i]} `;
        }
      }
      html1 += "</h4></div>";
      document.write(html1);
      let html2 = "<div><h4>";

      for (let i = 0; i < a.length; i++) {
        if (a[i] % 10 == 0) {
          html2 += `${a[i]} `;
          c++;
        }
      }
      document.write(
        `<h2>There are ${c} numbers which are divisible by 10:</h2>`
      );
      html2 += "</h4></div>";
      document.write(html2);
      //------------------------------------------------------------------
      for (let i = 0; i < a.length; i++) {
        if (a[i] % 2 == 0) {
        //   html2 += `${a[i]} `;
          sumEven += a[i];
        //   console.log(sumEven);
        }
      }
      document.write(`<h2>The sum of Even numbers are:${sumEven}:</h2>`);
      //------------------------------------------------------------------
      for (let i = 0; i < a.length; i++) {
        if (a[i] % 2 != 0) {
        //   html2 += `${a[i]} `;
          sumOdd += a[i];
        //   console.log(sumEven);
        }
      }
      document.write(`<h2>The sum of Odd numbers are:${sumOdd}:</h2>`);
     
    </script>
  </body>
</html>
