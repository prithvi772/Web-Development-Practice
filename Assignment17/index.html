  <body>
    <script>
      //First pattern
      for (let j = 1; j < 5; j++) {
        for (let i = 1; i <= 5; i++) {
          document.writeln("*" + " ");
        }
        document.write("<br>");
      }
      document.write("-------------------------------");
      document.write("<br>");

      // Second Pattern

      for (let i = 1; i <= 5; i++) {

        }
        document.write("<br>");
      }
      document.write("-------------------------------");
      document.write("<br>");

      //Third pattern(reverese of the above )

      for (let i = 5; i >= 1; i--) {
        for (let j = 1; j <= i; j++) {
          document.write("*" + " ");
        }
        document.write("<br>");
      }

      //Alternate method
      document.write("-------------------------------");
      document.write("<br>");
      for (let i = 1; i <= 10; i++) {
        for (let j = 10; j >= i; j--) {
          document.write("*" + " ");
        }
        document.write("<br>");
      }

      //Fourth pattern
      document.write("-------------------------------");
      document.write("<br>");

      for (let i = 1; i <= 5; i++) {
        for (let j = 1; j <= i; j++) {
          document.write(i + " ");
        }
        document.write("<br>");
      }

      //Fourth pattern(reverse of the above.)

      document.write("-------------------------------");
      document.write("<br>");

      for (let i = 5; i >=1; i--) {
        for (let j = 1; j<= i; j++) { 
          document.write(i+" ");
        }
        document.write("<br>");
      }
    </script>
