<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style></style>
  </head>
  <body>
    <div class="container w-50">
      <div class="text-primary text-center fs-3 h4 my-2">Sign-up</div>

      <div
        class="justify-content-center row  mx-auto text-white p-3 bg-primary"
      >
        <div class="col-6 text-end my-3">First name:</div>
        <div class="col-6 my-3 text-start">
          <!-- By-default it is at start -->
          <input type="text" placeholder="Enter first name" />
        </div>

        <div class="col-6 text-end my-3">Last name :</div>
        <div class="col-6 my-3">
          <input type="text" placeholder="Enter last name" />
        </div>
        <div class="col-6 text-end my-3">Date of birth :</div>
        <div class="col-6 my-3">
          <input type="date" placeholder="Enter Date" />
        </div>
        <div class="col-6 text-end my-3">Gender :</div>
        <div class="col-6 my-3">
          <input type="radio" name="Gender" />Male
          <input type="radio" name="Gender" />Female
        </div>

        <div class="col-6 text-end my-3">Country :</div>
        <div class="col-6 my-3">
          <select>
            <option>India</option>
            <option>America</option>
            <option>Jamaica</option>
          </select>
        </div>

        <div class="col-6 text-end my-3">Address :</div>
        <div class="col-6"><textarea name="" id=""></textarea></div>

        <div class="col-6 text-end my-3">Email:</div>

        <div class="col-6 my-3"><input type="email" /></div>

        <div class="col-6  text-end">Password:</div>
        <div class="col-6"><input type="password"></div>

        <div class=" col-10  text-end my-3"> 
          <input type="checkbox">I agree with terms and conditions.
        </div>

        <div class="w-75  text-center p-5 bg-white" >
          <button class="btn btn-secondary  ">Submit</button>
          <button class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
