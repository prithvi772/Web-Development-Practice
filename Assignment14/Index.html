<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = Number(window.prompt("Enter number to find the factorial:"));
      if (num < 0) {
        console.log("Please do not enter negative number.");
      } else {
        let fact = 1;
        for (let i = 1; i <= num; i++) {
          fact = fact * i;
        } //for
        document.write("Factorial is"+fact);   
      } //else
    </script>
  </body>
</html>
