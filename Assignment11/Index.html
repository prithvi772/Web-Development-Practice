<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=Number(window.prompt("Enter number for multiplication table:"));
        let n=num;
        
        for(let i=1;i<=10;i++){
             n=num*i;
            console.log(num+" * "+i+" = "+n);
        }
       
        //n=5
        //5=5*1=5  n=5 then i++
        //5=5*2=10 n=10 then i++
        //10=5*3=15 n=15 then i++
        //15=5*4=20 n=20

       
    </script>
</body>
</html>
